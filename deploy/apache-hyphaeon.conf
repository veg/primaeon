# apache-hyphaeon.conf — the Apache vhost for hyphaeon: static SvelteKit build + /api and /mcp proxied to Node.
#
# WHY THIS FILE EXISTS
#
# PLAN.md 3.5: the web app is static files under adapter-static and "runs everything locally by
# default"; the Node server (server/, port 7040) exists for MCP over HTTP and for jobs past the
# browser caps. Apache serves the build, terminates TLS, and reverse-proxies only /api/ and the
# OAuth + MCP paths to Node, so the browser sees ONE origin (the server's allowed-origin list is
# the issuer alone, server/src/config.js). Three things here are easy to get wrong and cost hours:
#
#   1. COOP/COEP on every HTML response. onnxruntime-web's multi-threaded WASM needs
#      crossOriginIsolated (SharedArrayBuffer), which needs Cross-Origin-Opener-Policy: same-origin
#      and Cross-Origin-Embedder-Policy: require-corp. web/static/_headers carries them for hosts
#      that read that file; Apache does not, so they are set here.
#   2. MIME types. .onnx and .wasm must be served with the types below or the fetch is refused
#      under COEP / WebAssembly.instantiateStreaming rejects it.
#   3. SSE through mod_proxy. /api/v1/jobs/:id/events and the MCP GET stream are long-lived
#      text/event-stream responses; the proxy must not buffer them (flushpackets=on) and must not
#      time out at 60 s (timeout=600 matches the job timeout).
#
# Replace hyphaeon.example.org and the two paths. Enable: proxy proxy_http headers rewrite ssl.

<VirtualHost *:443>
    ServerName hyphaeon.example.org
    DocumentRoot /var/www/hyphaeon/build

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/hyphaeon.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hyphaeon.example.org/privkey.pem

    # --- static site (SvelteKit adapter-static, strict, no fallback) ---------------------------
    <Directory /var/www/hyphaeon/build>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        # /report/local/?id=<uuid> is the prerendered page; /results/<uuid>/ redirects (PLAN.md 4.1)
        RewriteEngine On
        RewriteRule ^results/(.*)$ /report/$1 [R=301,L]
    </Directory>

    # Cross-origin isolation for onnxruntime-web threads (PHASE1.md), on documents only.
    <FilesMatch "\.html$">
        Header always set Cross-Origin-Opener-Policy "same-origin"
        Header always set Cross-Origin-Embedder-Policy "require-corp"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </FilesMatch>
    # The same-origin CSP PLAN.md 3.5 asks for; the HyPhy glue in a module worker needs
    # 'unsafe-eval' (PHASE1.md gap 11) and blob: workers.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'"

    AddType application/octet-stream .onnx
    AddType application/wasm .wasm
    AddType text/javascript .mjs
    # Model, ORT and HyPhy assets are content-addressed by the manifest: cache them for a long time.
    <LocationMatch "^/(models|ort|wasm)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
        Header set Cross-Origin-Resource-Policy "same-origin"
    </LocationMatch>
    <LocationMatch "^/_app/immutable/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # --- Node server: REST API, OAuth ceremony, MCP -----------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    # 8 MiB alignments + JSON overhead; the server refuses above 8 MiB itself.
    LimitRequestBody 10485760

    ProxyPass        /api/  http://127.0.0.1:7040/api/  retry=0 timeout=600 flushpackets=on
    ProxyPassReverse /api/  http://127.0.0.1:7040/api/
    ProxyPass        /mcp   http://127.0.0.1:7040/mcp   retry=0 timeout=600 flushpackets=on
    ProxyPassReverse /mcp   http://127.0.0.1:7040/mcp
    ProxyPass        /.well-known/oauth-authorization-server http://127.0.0.1:7040/.well-known/oauth-authorization-server
    ProxyPass        /.well-known/oauth-protected-resource   http://127.0.0.1:7040/.well-known/oauth-protected-resource
    ProxyPass        /.well-known/mcp.json                   http://127.0.0.1:7040/.well-known/mcp.json
    ProxyPass        /register  http://127.0.0.1:7040/register
    ProxyPass        /authorize http://127.0.0.1:7040/authorize
    ProxyPass        /token     http://127.0.0.1:7040/token
    ProxyPass        /revoke    http://127.0.0.1:7040/revoke

    # SSE must reach the browser unbuffered and uncompressed.
    <LocationMatch "^/(api/v1/jobs/[0-9a-f]{32}/events|mcp)$">
        SetEnv no-gzip 1
        SetEnv proxy-nokeepalive 0
        SetEnv proxy-sendchunked 1
    </LocationMatch>

    ErrorLog  ${APACHE_LOG_DIR}/hyphaeon-error.log
    CustomLog ${APACHE_LOG_DIR}/hyphaeon-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName hyphaeon.example.org
    Redirect permanent / https://hyphaeon.example.org/
</VirtualHost>
