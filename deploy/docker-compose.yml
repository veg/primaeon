# docker-compose.yml — run the HyphAeon Node server in a container (alternative to pm2).
#
# WHY THIS FILE EXISTS. Same server, same variables as deploy/ecosystem.config.cjs; the models
# directory (manifest.json + .onnx) and the job data directory are bind mounts so an image rebuild
# never loses jobs and the models can be swapped without a rebuild. Apache (or any proxy) in
# front still terminates TLS and serves the static build — see deploy/apache-hyphaeon.conf and
# deploy/README.md. Build context is the directory ABOVE the app so the sibling HyphAeon/js
# library is reachable (Dockerfile).
#
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  hyphaeon-server:
    build:
      context: ../..
      dockerfile: hyphaeon-app/deploy/Dockerfile
      platforms: ["linux/amd64"]
    image: hyphaeon-server:local
    container_name: hyphaeon-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:7040:7040"
    environment:
      HYPHAEON_SERVER_ISSUER: "https://hyphaeon.example.org"
      HYPHAEON_SERVER_WORKERS: "1"
      HYPHAEON_SERVER_THREADS: "4"
      HYPHAEON_SERVER_LOG: "info"
      # HYPHAEON_SERVER_EXTRA_ORIGINS: "http://localhost:5173"   # development only
    volumes:
      - ./data:/data
      - ../web/static/models:/models:ro
    stop_grace_period: 30s
    mem_limit: 6g
